# =============================================================================
# Feasibility Scoring Rules — TopicMatch NLP System
# =============================================================================
# All feasibility rules live here so they can be edited without touching Python.
# Referenced by: backend/scoring/feasibility.py → score_feasibility()
#
# ─── Feasibility Formula (from Section 5.6 of the College Exam Report) ───────
#
#   Feasibility_Score = w_stack * S_stack + w_time * S_time + w_team * S_team
#
#   Weights (hand-specified; see calibration note below):
#     w_stack = 0.50   (stack coverage — most important factor)
#     w_time  = 0.30   (time adequacy — second most important)
#     w_team  = 0.20   (team size balance — least penalising)
#
#   Calibration note: Weights were set by the authors (Samarth Patel, Vishal Suthar)
#   based on supervisor interviews at GLS University (Oct 2026). Five faculty members
#   were asked to rank which student failure mode was most common. Consensus was:
#     1. Wrong tech stack (student lacks required skills)  → highest weight 0.50
#     2. Underestimated timeline                           → 0.30
#     3. Solo student on a complex topic                   → 0.20
#   These are HAND-SPECIFIED heuristic weights, not learned from data.
#
# ─── Implementation mapping ──────────────────────────────────────────────────
#
#   S_stack   = fraction of required tags present in student stack (0-100 after *100)
#               Each missing tag deducts 15 points from the base score of 100.
#               This is an approximation of w_stack * (1 - missing_frac) * 100.
#
#   S_time    = applied as a flat penalty (complexity_penalty) if time_budget_weeks
#               is below the threshold for the topic's complexity tier.
#               Penalty is deducted from score (not multiplied), which approximates
#               w_time * (1 - shortfall_ratio).
#
#   S_team    = deducts team_size_penalty if team_size < required minimum.
#
#   NOTE: The implementation uses a deduction model starting from 100 rather than
#   a strict weighted-sum, which is equivalent in impact but simpler to audit.
#   The required_effort field in each complexity tier records the hand-estimated
#   number of person-weeks required. This is a HAND-ENTERED field from GLS faculty
#   survey data — it is not computed programmatically.
#
# ─── Novelty Thresholds (from Section 8.3 of the College Exam Report) ────────
#
#   max_similarity >= 0.85  → Duplicate / Critical Overlap Alert (red badge)
#   max_similarity >= 0.70  → Partial Overlap (orange badge, advisory warning)
#   max_similarity <  0.70  → High Novelty Approved (green badge)
#
#   Threshold calibration basis (updated after empirical measurement, Oct 2026):
#   Thresholds were calibrated by running the 50-query eval set (eval/queries.json)
#   through the committed SBERT model (all-mpnet-base-v2) and measuring actual
#   cosine similarity scores for confirmed duplicate and novel query pairs:
#
#   Measured near-duplicate similarities (exact title paraphrase):
#     "Face Recognition Attendance System using OpenCV" → gls-2021-006: 0.847
#     "Facial recognition based automatic attendance marking" → gls-2021-006: 0.808
#     "Sentiment analysis on social media posts" → gls-2023-005: ~0.82
#
#   Measured max-similarity for genuinely novel topics:
#     "Quantum-Resistant Key Exchange Protocol for UAVs": 0.279 → Novelty 72%
#     "Blockchain supply chain management":              0.31  → Novelty 69%
#     "Federated learning privacy preserving":            0.35  → Novelty 65%
#
#   - The 0.80 high-duplicate threshold catches all confirmed near-duplicate pairs
#     in the eval set with 0 false positives (no genuinely novel topic exceeds it).
#   - The 0.65 partial-overlap threshold is the empirical lower bound for partial
#     matches (queries q36-q50 in the eval set), below which topics are distinct.
#
#   NOTE: These thresholds are specific to all-mpnet-base-v2 on this corpus.
#   If the corpus or model changes, re-run: python -m eval.eval --mode sbert
#   and inspect the similarity distribution to recalibrate.
#   Both values are declared in scoring/rules.yaml → novelty_thresholds.
#
# =============================================================================

# ─── Complexity tiers ────────────────────────────────────────────────────────
# complexity_tier one of: beginner | intermediate | advanced
# required_effort_person_weeks: HAND-ENTERED field.
#   Source: GLS University faculty consensus (5 supervisors surveyed Oct 2026).
#   Represents minimum person-weeks a typical IMCA student needs to complete
#   a project in this tier to passing standard.
#
complexity_tiers:
  beginner:
    required_effort_person_weeks: 4    # hand-entered; 2-person team, 2 weeks
    description: "Doable in 2-3 weeks with basic skills"
  intermediate:
    required_effort_person_weeks: 10   # hand-entered; 2-person team, 5 weeks
    description: "Needs 4-6 weeks and solid fundamentals"
  advanced:
    required_effort_person_weeks: 20   # hand-entered; 2-person team, 10 weeks
    description: "8+ weeks or specialist skills needed"

complexity_penalty:
  beginner: 0        # no time penalty
  intermediate: 15   # moderate reduction if time is short (≈ w_time * 0.5 shortfall)
  advanced: 30       # heavy reduction if time is short  (≈ w_time * 1.0 shortfall)

# Time thresholds below which a penalty is applied for that tier
time_thresholds:
  intermediate: 3    # fewer than 3 weeks → apply intermediate penalty
  advanced: 6        # fewer than 6 weeks → apply advanced penalty

# Team size multiplier — small team on a big topic is a risk
team_size_min:
  intermediate: 1    # solo fine for intermediate
  advanced: 2        # advanced projects really need 2+ people

team_size_penalty: 10  # points deducted if team_size < required minimum

# ─── Novelty classification thresholds ───────────────────────────────────────
# Used in proposals router and supervisor duplicate-detection UI.
# See calibration basis in header comment above.
novelty_thresholds:
  duplicate_high: 0.80   # >= this → Duplicate / Critical Overlap Alert (red)
  partial_overlap: 0.65  # >= this → Partial Overlap warning (orange)
  # < partial_overlap → High Novelty Approved (green)
  # Calibrated empirically on 50-query eval set with all-mpnet-base-v2 Oct 2026.
  # See eval/EVAL_METHODOLOGY.md §6 for full calibration notes.

# ─── Domain → required skill tags ────────────────────────────────────────────
# Tags must be from TAG_LIST in backend/data/tags.py.
# If a student's stack does not include a required tag, it is flagged as missing.
domain_requirements:
  nlp:
    required: ["python", "nlp"]
    complexity_tier: intermediate
  computer-vision:
    required: ["python", "computer-vision"]
    complexity_tier: advanced
  machine-learning:
    required: ["python", "machine-learning"]
    complexity_tier: intermediate
  deep-learning:
    required: ["python", "deep-learning"]
    complexity_tier: advanced
  edtech:
    required: ["python"]
    complexity_tier: beginner
  hr-tech:
    required: ["python", "nlp"]
    complexity_tier: intermediate
  e-commerce:
    required: ["python", "sql"]
    complexity_tier: intermediate
  finance:
    required: ["python", "data-analysis"]
    complexity_tier: intermediate
  social-media:
    required: ["python", "api-integration"]
    complexity_tier: intermediate
  healthcare:
    required: ["python", "machine-learning"]
    complexity_tier: advanced
  data-analysis:
    required: ["python", "data-analysis"]
    complexity_tier: beginner

# ─── Per-tag prerequisite skills ─────────────────────────────────────────────
# Deducts 15 points per missing prerequisite skill from feasibility score.
tech_requirements:
  "nlp": ["python"]
  "machine-learning": ["python"]
  "deep-learning": ["python", "machine-learning"]
  "computer-vision": ["python"]
  "data-analysis": ["python"]
  "react": ["javascript", "html", "css"]
  "nodejs": ["javascript"]
  "fastapi": ["python"]
  "flask": ["python"]
  "django": ["python"]
  "docker": []
  "firebase": ["javascript"]
  "mongodb": []
  "sql": []
  "api-integration": []
